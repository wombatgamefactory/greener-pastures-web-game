<title>Greener Pastures Sim Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #eff2ec;
  --surface: #fbfcfa;
  --surface-2: #f4f6f2;
  --ink: #17231c;
  --ink-2: #4a5950;
  --muted: #7d8a81;
  --grid: #dfe5dc;
  --axis: #c3ccc4;
  --hair: rgba(23, 35, 28, 0.10);
  --accent: #2e6a4e;
  --accent-wash: rgba(46, 106, 78, 0.12);
  --band: rgba(46, 106, 78, 0.14);
  --s2p: #2a78d6;
  --s3p: #eb6834;
  --s4p: #1baf7a;
  --good: #0ca30c;
  --good-ink: #006300;
  --warn: #fab219;
  --warn-ink: #8a5a00;
  --crit: #d03b3b;
  --crit-ink: #b02a2a;
  --observe: #62748a;
  --beyond: #b02a2a;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1310;
    --surface: #161d19;
    --surface-2: #1c2520;
    --ink: #ecf1ed;
    --ink-2: #b5c1b9;
    --muted: #87948b;
    --grid: #26302a;
    --axis: #3a463e;
    --hair: rgba(255, 255, 255, 0.10);
    --accent: #74c29a;
    --accent-wash: rgba(116, 194, 154, 0.14);
    --band: rgba(116, 194, 154, 0.16);
    --s2p: #3987e5;
    --s3p: #d95926;
    --s4p: #199e70;
    --good-ink: #3ecf3e;
    --warn-ink: #fab219;
    --crit-ink: #f07070;
    --observe: #93a4b8;
    --beyond: #f07070;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1310;
  --surface: #161d19;
  --surface-2: #1c2520;
  --ink: #ecf1ed;
  --ink-2: #b5c1b9;
  --muted: #87948b;
  --grid: #26302a;
  --axis: #3a463e;
  --hair: rgba(255, 255, 255, 0.10);
  --accent: #74c29a;
  --accent-wash: rgba(116, 194, 154, 0.14);
  --band: rgba(116, 194, 154, 0.16);
  --s2p: #3987e5;
  --s3p: #d95926;
  --s4p: #199e70;
  --good-ink: #3ecf3e;
  --warn-ink: #fab219;
  --crit-ink: #f07070;
  --observe: #93a4b8;
  --beyond: #f07070;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--body);
  padding-inline: 20px;
  padding-block: 0 48px;
}
table { font-size: inherit; color: inherit; }
.wrap { max-width: 1440px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 15px; font-weight: 700; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sub { color: var(--ink-2); }
.muted { color: var(--muted); }
a { color: var(--accent); }

/* masthead */
.mast { padding-block: 28px 20px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) auto; align-items: end; border-bottom: 1px solid var(--hair); }
.mast h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.mast h1 span { color: var(--accent); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; }
.fact { display: flex; flex-direction: column; }
.fact b { font-family: var(--mono); font-weight: 500; font-size: 13px; }
.verdict { display: flex; gap: 8px; flex-wrap: wrap; }
.vcount { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 8px 14px; min-width: 88px; }
.vcount b { display: block; font: 700 28px/1 var(--display); }
.vcount.fail b { color: var(--crit-ink); }
.vcount.pass b { color: var(--good-ink); }
.caveat { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); max-width: 110ch; }
.caveat strong { color: var(--ink); }

/* sections */
section { margin-top: 34px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sechead p { margin: 0; color: var(--ink-2); max-width: 80ch; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel h3 { margin-bottom: 2px; }
.panel .note { font-size: 12.5px; color: var(--muted); margin: 2px 0 12px; }
.span2 { grid-column: span 2; }
@media (max-width: 760px) { .span2 { grid-column: auto; } .mast { grid-template-columns: 1fr; } }

/* attention list */
.attn { display: grid; gap: 14px; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
@media (max-width: 1000px) { .attn { grid-template-columns: 1fr; } }
.flags { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.flag { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 7px; background: var(--surface-2); border-left: 3px solid var(--observe); }
.flag.crit { border-left-color: var(--crit); }
.flag.warn { border-left-color: var(--warn); }
.flag .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--body); color: #fff; background: var(--observe); }
.flag.crit .ic { background: var(--crit); }
.flag.warn .ic { background: var(--warn); color: #3a2800; }
.flag .t { font-weight: 600; }
.flag .d { color: var(--ink-2); font-size: 12.5px; }

/* check tiles */
.checks { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.check { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 0; min-width: 0; }
.check summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.check summary::-webkit-details-marker { display: none; }
.check summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.check[open] { grid-column: 1 / -1; }
.check .id { font: 500 12px var(--mono); color: var(--muted); }
.check .ti { font-weight: 600; line-height: 1.3; }
.check .hl { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.check[open] .hl { -webkit-line-clamp: unset; }
.check .body { padding: 0 12px 12px; font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow: auto; }
.check .body b { color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--body); letter-spacing: 0.05em; padding: 4px 7px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.PASS { color: var(--good-ink); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.FAIL { color: var(--crit-ink); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.pill.OBSERVE { color: var(--observe); background: color-mix(in srgb, var(--observe) 14%, transparent); }
.check.FAIL { border-color: color-mix(in srgb, var(--crit) 55%, transparent); }

/* charts: rows of label | track | value */
.rows { display: flex; flex-direction: column; gap: 7px; }
.row { display: grid; grid-template-columns: 76px minmax(0, 1fr) 64px; gap: 10px; align-items: center; }
.row.wl { grid-template-columns: 104px minmax(0, 1fr) 64px; }
.row .l { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.row .v { font: 500 12.5px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 18px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--grid); }
.band { position: absolute; top: 1px; bottom: 1px; background: var(--band); border-radius: 3px; }
.refline { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed var(--muted); }
.dot { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.dot.hollow { background: var(--surface); border: 2px solid var(--accent); }
.ci { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: var(--ink-2); border-radius: 1px; }
.bar { position: absolute; top: 3px; bottom: 3px; left: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar.neg { border-radius: 4px 0 0 4px; }
.seg { position: absolute; top: 3px; bottom: 3px; }
.axis { position: relative; height: 16px; margin-left: 86px; margin-right: 74px; font: 10.5px var(--mono); color: var(--muted); }
.row.wl ~ .axis, .axis.wl { margin-left: 114px; }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend i.band { position: static; width: 16px; height: 10px; border-radius: 2px; }
.legend i.hollow { background: var(--surface); border: 2px solid var(--ink-2); }
.legend i.dash { width: 0; height: 12px; border-radius: 0; border-left: 1.5px dashed var(--muted); }
.chip { width: 11px; height: 11px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18); }
.sp { display: inline-block; font: 600 11px var(--mono); padding: 1px 5px; border-radius: 4px; color: #fff; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 7px; padding: 9px 11px; }
.tile b { display: block; font: 500 20px/1.2 var(--mono); }
.tile span { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; display: block; }

/* tables */
.tw { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; }
.t th, .t td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.t th { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.t td { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.t th:first-child, .t td:first-child { text-align: left; font-family: var(--body); font-size: 13px; }
.t td.txt { font-family: var(--body); text-align: left; }
.t tr:hover td { background: var(--accent-wash); }
.t .minibar { display: inline-block; height: 8px; background: var(--accent); border-radius: 0 3px 3px 0; vertical-align: middle; margin-right: 6px; opacity: 0.8; }
.beyond { color: var(--beyond); font-weight: 600; }
.within { color: var(--muted); }
.tag { font: 600 10px var(--body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--hair); border-radius: 4px; padding: 1px 4px; margin-left: 6px; }
.t td.hi { box-shadow: inset 3px 0 0 var(--crit); }

.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--surface); font: 12px/1.4 var(--body); padding: 6px 9px; border-radius: 6px; max-width: 320px; opacity: 0; transition: opacity 0.08s; }
[data-tip] { cursor: default; }
.foot { margin-top: 40px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
</style>
<style>
.check .tr { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
.check .rs { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink); line-height: 1.4; padding-top: 4px; border-top: 1px solid var(--grid); margin-top: 4px; }
.check .rs b, .check .tr b { font-weight: 600; }
.check .body .raw { color: var(--muted); }
.gloss { display: grid; gap: 6px 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); font-size: 12.5px; color: var(--ink-2); }
.gloss b { color: var(--ink); font-weight: 600; }
.t td.wrap { white-space: normal; }
@page { size: A4 landscape; margin: 10mm; }
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { padding-inline: 0; padding-block: 0; }
  .panel, .check, .flag, .tile, tr { break-inside: avoid; }
  .sechead, h2, h3 { break-after: avoid; }
  section { break-before: auto; }
  .tw { overflow: visible; }
  .attn .panel { break-inside: auto; }
  .t th { white-space: normal; }
  .t th, .t td { padding: 4px 5px; }
  .noprint { display: none; }
  #cards .grid { grid-template-columns: 1fr; }
  .wrap { max-width: none; }
  .check summary { cursor: auto; }
  .tip { display: none; }
}
</style>

<div class="wrap" id="app"></div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
const DATA = /*__DATA__*/null;

const SEATS = ["2p", "3p", "4p"];
const PLAYERS = { "2p": "2 players", "3p": "3 players", "4p": "4 players" };
const GAMES = { "2p": "2-player games", "3p": "3-player games", "4p": "4-player games" };
const SUIT_ORDER = ["wheat", "dairy", "vegetable", "apiary", "orchard"];
const SUIT_HEX = { orchard: "#CA5744", dairy: "#F4D68D", apiary: "#E7963B", wheat: "#E2C488", vegetable: "#9CAC85" };
const SUIT_ACTION = { orchard: "Draw 2", dairy: "Build", apiary: "Grow", wheat: "Harvest", vegetable: "Deliver" };
const BALLOON_SUIT = { red: "orchard", cream: "dairy", orange: "apiary", wheat: "wheat" };
const SEAT_VAR = { "2p": "var(--s2p)", "3p": "var(--s3p)", "4p": "var(--s4p)" };
const STATUS = { PASS: "Passed", FAIL: "Failed", OBSERVE: "Tracked" };

// --- tiny DOM helpers ------------------------------------------------------------------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const isNum = (v) => typeof v === "number" && isFinite(v);
function fmt(v, dp = 1, unit = "") {
  if (!isNum(v)) return "n/a";
  return v.toLocaleString("en-GB", { minimumFractionDigits: dp, maximumFractionDigits: dp }) + unit;
}
const pct = (s) => (s == null ? null : parseFloat(String(s)));
const ciOf = (s) => { const m = String(s || "").match(/([\d.]+)%\s*-\s*([\d.]+)%/); return m ? [+m[1], +m[2]] : null; };
const rangeText = (s) => { const c = ciOf(s); return c ? `${c[0]}% to ${c[1]}%` : s; };
const clamp = (x) => Math.max(0, Math.min(100, x));
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const bySeat = (m, dp = 1, unit = "") => (m ? SEATS.map((s) => `${PLAYERS[s]} ${fmt(m[s], dp, unit)}`).join(", ") : null);
const suitLabel = (s) => h("span", { class: "l" }, h("span", { class: "chip", style: `background:${SUIT_HEX[s]}` }), cap(s));
const seatLabel = (s) => h("span", { class: "l", title: PLAYERS[s] }, h("span", { class: "sp", style: `background:${SEAT_VAR[s]}` }, s));
const checkId = (id) => "a" + String(id).padStart(2, "0");

function panel(title, note, ...body) {
  return h("div", { class: "panel" }, h("h3", {}, title), note ? h("p", { class: "note" }, note) : null, ...body);
}
function section(id, title, blurb, ...body) {
  return h("section", { id }, h("div", { class: "sechead" }, h("h2", {}, title), blurb ? h("p", {}, blurb) : null), ...body);
}
function axis(ticks, lo, hi, unit = "", wide = false) {
  return h("div", { class: "axis" + (wide ? " wl" : "") }, ticks.map((t) => h("span", { style: `left:${((t - lo) / (hi - lo)) * 100}%` }, t + unit)));
}
function legend(items) {
  return h("div", { class: "legend" }, items.map(([cls, style, text]) => h("span", {}, h("i", { class: cls, style }), text)));
}

// A row with a target band (or target line), one filled marker and an optional hollow one.
function bullet({ label, value, lo, hi, band, floor, second, secondName, color, unit = "", dp = 1, tip, wide }) {
  const pos = (v) => clamp(((v - lo) / (hi - lo)) * 100);
  const track = h("div", { class: "track" });
  if (band) track.append(h("div", { class: "band", style: `left:${pos(band[0])}%;width:${pos(band[1]) - pos(band[0])}%` }));
  if (isNum(floor)) track.append(h("div", { class: "refline", style: `left:${pos(floor)}%` }));
  if (isNum(second)) track.append(h("div", { class: "dot hollow", style: `left:${pos(second)}%;border-color:${color || "var(--accent)"}`, "data-tip": `${tip || label}, ${secondName || "second measure"}: ${fmt(second, dp, unit)}` }));
  if (isNum(value)) track.append(h("div", { class: "dot", style: `left:${pos(value)}%;background:${color || "var(--accent)"}`, "data-tip": `${tip || label}: ${fmt(value, dp, unit)}` }));
  return h("div", { class: "row" + (wide ? " wl" : "") }, typeof label === "string" ? h("span", { class: "l" }, label) : label, track, h("span", { class: "v" }, fmt(value, dp, unit)));
}
// A dot with its likely range, against a reference line.
function rangeRow({ label, value, ci, lo, hi, ref, tip, flag }) {
  const pos = (v) => clamp(((v - lo) / (hi - lo)) * 100);
  const track = h("div", { class: "track" });
  if (isNum(ref)) track.append(h("div", { class: "refline", style: `left:${pos(ref)}%` }));
  if (ci) track.append(h("div", { class: "ci", style: `left:${pos(ci[0])}%;width:${Math.max(1, pos(ci[1]) - pos(ci[0]))}%` }));
  track.append(h("div", { class: "dot", style: `left:${pos(value)}%;${flag ? "background:var(--crit)" : ""}`, "data-tip": tip }));
  return h("div", { class: "row wl" }, label, track, h("span", { class: "v" }, fmt(value, 1, "%")));
}
function barRow({ label, value, max, unit = "", dp = 1, tip, color, wide = true }) {
  const track = h("div", { class: "track" }, h("div", { class: "bar", style: `width:${clamp((value / max) * 100)}%;${color ? `background:${color}` : ""}`, "data-tip": tip || `${fmt(value, dp, unit)}` }));
  return h("div", { class: "row" + (wide ? " wl" : "") }, typeof label === "string" ? h("span", { class: "l" }, label) : label, track, h("span", { class: "v" }, fmt(value, dp, unit)));
}

// --- the checks, in plain words -------------------------------------------------------
// name: what to call it; tracks: what it watches; result(d, c): what this run found.
// A check the simulator adds later falls back to its own title and wording.
const grab = (c, re) => (String(c.measured || "") + " " + String(c.summary || "")).match(re);
const CHECKS = {
  2: { name: "Cards paid to rivals", tracks: "How many cards players pay onto rivals' Notice Boards when they visit, and how many of those the board's owner goes on to harvest.",
    result: (d) => { const r = d.readings; return `${fmt(r.fees_game, 1)} cards a game go onto rivals' boards, and owners harvest ${fmt(r.fees_banked, 0)}% of them. ${fmt(r.fees_to_leader, 0)}% were paid to whoever was winning at the time.`; } },
  4: { name: "Notice Boards filling up", tracks: "Whether a Notice Board can get so full that nobody can visit it.",
    result: () => "Cannot happen in this game: 3+ is only the minimum to harvest, so a Notice Board never fills up." },
  5: { name: "Nowhere to visit", tracks: "Turns where a player has cards in hand but no rival board they can visit.",
    result: (d) => `${bySeat(d.readings.clog_seat, 1, "%")} of turns.` },
  6: { name: "Barns filling up late", tracks: "Whether deliveries empty the barns as the game ends. Fails if the typical barn is bigger in the last third of the game than in the middle third.",
    result: (d) => { const g = d.readings.glut, gs = d.readings.glut_seat; if (!g) return null;
      return `A typical barn holds ${fmt(g.middle)} cards mid-game and ${fmt(g.last)} near the end.` + (gs ? ` By player count: ${SEATS.map((s) => `${PLAYERS[s]} ${fmt(gs[s].middle)} to ${fmt(gs[s].last)}`).join(", ")}.` : ""); } },
  7: { name: "One board getting most visits", tracks: "Whether one Notice Board power is used far more than the others. A fair split is 20% each; fails if any board takes more than 35%.",
    result: (d) => { const x = d.readings.doors; if (!x) return null; const e = Object.entries(x).sort((a, b) => b[1] - a[1]);
      return `The ${cap(e[0][0])} board takes ${fmt(e[0][1], 0)}% of visits. The rest: ${e.slice(1).map(([k, v]) => `${cap(k)} ${fmt(v, 0)}%`).join(", ")}.`; } },
  8: { name: "Visiting neighbours", tracks: "How often players visit a rival's Notice Board. Target: at least 0.5 visits per player per turn.",
    result: (d) => `${fmt(d.readings.hook, 2)} visits per player per turn (${bySeat(d.readings.hook_seat, 2)}). ${fmt(d.readings.cross_table, 0)}% of visits went to a rival.` },
  9: { name: "Visits to the Wheat board", tracks: "How many visits the Wheat player's Notice Board gets, and how often Wheat cards are played.",
    result: (d, c) => { const a = grab(c, /receives ([\d.]+) fees a game/), b = grab(c, /play rate ([\d.]+)% against a band of ([\d.]+)%-([\d.]+)%/);
      return a ? `The Wheat board gets ${a[1]} visits a game.` + (b ? ` Wheat cards are played ${b[1]}% of the time, against a usual range of ${b[2]}% to ${b[3]}%.` : "") : null; } },
  11: { name: "Dairy player unable to Build", tracks: "How often the Dairy player starts a turn with no Build they can afford.",
    result: (d) => `${fmt(d.readings.dairy_nobuild)}% of Dairy turns, against ${fmt(d.readings.other_nobuild)}% for the other crops.` },
  12: { name: "Balloon raids", tracks: "How often a balloon is taken from a rival's Aerodrome, and whether the raided player falls behind.",
    result: (d) => { const x = d.readings.raids; return x ? `${fmt(x.per_game, 1)} raids a game. Raided players scored ${fmt(x.raided)} on average, others ${fmt(x.others)}.` : null; } },
  13: { name: "Games that get stuck", tracks: "Games that stop because the cards run out or the simulator hits its move limit.",
    result: (d) => `${bySeat(d.readings.locked_seat, 1, "%")} of games.` },
  15: { name: "Workers get used", tracks: "The share of Workers earned that players actually use. Passes if at least half are used.",
    result: (d) => `${fmt(d.readings.meeple_spend_rate)}% of Workers earned were used.` },
  16: { name: "Actions per turn", tracks: "How much a player does each turn: the main action plus any visit. Target: about 1.5.",
    result: (d) => { const a = d.series["actions per turn (mean)"]; return `${fmt(d.readings.actions, 2)} actions per player per turn` + (a ? ` (${SEATS.map((s) => `${PLAYERS[s]} ${fmt(a[s].v, 2)}`).join(", ")}).` : "."); } },
  17: { name: "How often players visit", tracks: "The share of turns on which a player visits a rival. Target: 30% to 60% of turns, at every player count.",
    result: (d) => `${fmt(d.readings.slot_turns)}% of turns overall: ${bySeat(d.readings.slot_turns_seat, 1, "%")}.` },
  18: { name: "Where barn cards come from", tracks: "How much of a barn comes from rivals' visits rather than your own buildings, and whether one Notice Board gets most of the visits.",
    result: (d) => { const r = d.readings; return `${fmt(r.fee_share)}% of barn cards arrived through rivals' visits. Of the cards players harvested, ${fmt(r.harvest_own)}% came from their own buildings and ${fmt(r.harvest_fee)}% from their Notice Board. The busiest board gets ${fmt(r.busiest_board)}% of a game's visits (a fair share is ${fmt(r.busiest_even)}%).`; } },
  20: { name: "Notice Boards left unharvested", tracks: "How often a Notice Board sits at 3 or more cards without its owner harvesting it.",

  21: { name: "Drawing a card when visited", tracks: "A rule where the visited player draws a card. It is not part of the current game.",
    result: (d, c) => (/NO HOST DRAW/.test(c.measured || "") ? "Switched off in this game, so there is nothing to measure." : null) },

    result: (d) => { const r = d.readings; if (!r.receipt_vp) return null; const e = r.empty_crop ? Object.entries(r.empty_crop).sort((a, b) => b[1] - a[1])[0] : null;
      return `Island points per player per game: ${SUIT_ORDER.map((s) => `${cap(s)} ${fmt(r.receipt_vp[s])}`).join(", ")}.` + (e ? ` ${cap(e[0])} players most often start a turn with no cards (${fmt(e[1])}% of turns).` : ""); } },

  24: { name: "Deck reshuffles and leftover barn cards", tracks: "How often each crop deck runs out and is reshuffled, and how many cards are still in barns when the game ends.",
    result: (d) => `A crop deck in play is typically reshuffled ${fmt(d.readings.reshuffles, 0)} times a game. ${fmt(d.readings.barn_stranded, 1)} cards per player are still in a barn at the end.` },
  25: { name: "Village Store coins", tracks: "Coins made from spare barn cards, and what players spent them on.",
    result: (d) => { const c = d.readings.coins; return c ? `${fmt(c.minted, 1)} coins per player per game, ${fmt(c.on_builds, 0)}% spent on Builds and ${fmt(c.on_grows, 0)}% on Grows; ${fmt(c.dead, 1)} left unused.` : null; } },
  26: { name: "Is the Store exchange automatic?", tracks: "Whether players always turn every spare barn card into coins, which would make it a chore rather than a choice.",
    result: (d) => { const x = d.readings.c113; return x ? `Players took every coin on offer ${fmt(x.all)}% of the time.` : null; } },
  27: { name: "Hand size", tracks: "How many cards players hold at the start of a turn. The simulator caps hands at 7; the real game has no hand limit.",
    result: (d) => { const x = d.readings.hand; return x ? `${fmt(x.mean)} cards on average, ${fmt(x.peak, 0)} at most. ${fmt(x.at_bound)}% of turns start with 7. The simulator's hardest single decision had ${fmt(x.worst_moves, 0)} options.` : null; } },
};
const RETIRED_NAMES = { 1: "Too many coins", 3: "Slow starts", 10: "The Bread Hall card", 12: "Balloon raids", 14: "Bonus action options", 19: "Coins (old version)", 25: "Village Store coins", 26: "Is the Store exchange automatic?" };
function plainCheck(d, c) {
  const k = CHECKS[c.id];
  let result = null;
  try { result = k && k.result ? k.result(d, c) : null; } catch (e) { result = null; }
  return { name: k ? k.name : c.title, tracks: k ? k.tracks : null, result: result || c.summary || c.measured || "" };
}

// --- the flags: what needs attention, computed the same way every run ------------------
function fairShare(suits) {
  let w = 0, n = 0;
  for (const s of suits) { const g = +s.seat_games; w += (pct(s.win) / 100) * g; n += g; }
  return n ? (w / n) * 100 : null;
}
function computeFlags(d) {
  const r = d.readings, out = [];
  const add = (sev, t, dd) => out.push({ sev, t, d: dd });
  for (const c of d.checks) if (c.status === "FAIL") { const p = plainCheck(d, c); add("crit", `Failed: ${p.name}`, p.result); }
  if (r.slot_turns_seat) for (const s of SEATS) {
    const v = r.slot_turns_seat[s];
    if (v > 60) add("crit", `Too many turns with a visit in ${GAMES[s]}: ${fmt(v)}%`, "The target is 30% to 60% of turns.");
    else if (v < 30) add("crit", `Too few turns with a visit in ${GAMES[s]}: ${fmt(v)}%`, "The target is 30% to 60% of turns.");
    else if (v > 57 || v < 33) add("warn", `Close to the limit on visits in ${GAMES[s]}: ${fmt(v)}% of turns`, `Within 3 points of the ${v > 45 ? "60% maximum" : "30% minimum"}.`);
  }
  if (isNum(r.hook) && r.hook < 0.5) add("crit", `Players visit rivals too rarely: ${fmt(r.hook, 2)} visits per turn`, "The target is at least 0.5 visits per player per turn.");
  if (r.hook_seat) for (const s of SEATS) if (r.hook_seat[s] < 0.5) add("warn", `Players visit rivals too rarely in ${GAMES[s]}: ${fmt(r.hook_seat[s], 2)} per turn`, "The target is at least 0.5 visits per player per turn.");
  const fair = fairShare(d.suits);
  for (const s of d.suits) {
    const ci = ciOf(s.ci), v = pct(s.win);
    const t = `${cap(s.suit)} players win ${fmt(v)}% of their games; a fair share is ${fmt(fair)}%`;
    if (ci && ci[1] < fair * 0.5) add("crit", t, `Far too low: even the top of its likely range (${rangeText(s.ci)}) is under half a fair share.`);
    else if (ci && ci[1] < fair * 0.75) add("warn", t, `Too low: its likely range is ${rangeText(s.ci)}.`);
    else if (ci && ci[0] > fair * 1.4) add("warn", t, `Too high: its likely range is ${rangeText(s.ci)}.`);
  }
  if (d.vp_sources && d.vp_sources.island < 50) add("warn", `Island tokens are only ${d.vp_sources.island}% of the winner's points`, "The design wants at least half of a winning score to come from island deliveries.");
  for (const s of d.seats) {
    const dev = parseFloat(s.dev);
    if (Math.abs(dev) > 3) add("warn", `Seat ${+s.seat + 1} in ${GAMES[s.seats]} wins ${fmt(Math.abs(dev))} points ${dev > 0 ? "more" : "less"} often than a fair share`, "The target is within 3 points either way.");
  }
  const un = d.series["unfinished"];
  if (un) for (const s of SEATS) if (un[s].v > 1.5) {
    const e = d.end_reasons[s] || {};
    add("warn", `${fmt(un[s].v)}% of ${GAMES[s]} never finished`, `${e.stalled || 0} ran out of cards and ${e.maxMoves || 0} hit the simulator's move limit.`);
  }
  if (r.hand) {
    if (r.hand.worst_moves > 250000) add("warn", `The simulator faced ${fmt(r.hand.worst_moves, 0)} options at a single decision`, "This happens when a player discards down to 7 cards, and it slows the simulator badly.");
    if (r.hand.at_bound > 10) add("warn", `${fmt(r.hand.at_bound)}% of turns start with 7 cards in hand`, "7 is the simulator's cap, not a rule of the game, so the hand-size numbers here are rough.");
  }
  if (r.meeple && r.meeple.stranded_share > 15) {
    const top = r.meeple_stranded_mix ? Object.entries(r.meeple_stranded_mix).sort((a, b) => b[1] - a[1])[0] : null;
    add("warn", `${fmt(r.meeple.stranded_share)}% of Workers earned are never used`, top ? `${cap(top[0])} (${SUIT_ACTION[top[0]]}) Workers are ${fmt(top[1])}% of the unused ones.` : "");
  }
  if (r.space_choice_3vp === 0) add("note", "Computer players never give up the 6 VP space for a Worker", "Only a real table can tell us whether people would.");
  const tc = d.sky.token_choice;
  if (tc && tc.lower_for_worker === 0) add("note", "Computer players always take the higher-scoring island token", "None took the lower token to get its Worker. Only a real table can tell us whether people would.");
  if (d.sky.token_values && isNum(d.sky.wild_receipts)) {
    const n = Object.values(d.sky.token_values).reduce((a, b) => a + b, 0);
    if (n) add("note", `${fmt((d.sky.wild_receipts / n) * 100)}% of island tokens taken were wild (any 2 crops)`, `${fmt(d.sky.wild_receipts, 0)} of ${fmt(n, 0)} tokens.`);
  }
  if (r.c113 && r.c113.all > 90) add("note", `Players turn every spare barn card into coins ${fmt(r.c113.all)}% of the time`, "Computer players always take a free thing; real players may not bother.");
  if (r.coins && r.coins.dead >= 2) add("note", `${fmt(r.coins.dead, 1)} Village Store coins per player are left unused at the end`, "Coins score nothing.");
  if (isNum(r.busiest_board) && r.busiest_board > 45) add("note", `One Notice Board gets ${fmt(r.busiest_board)}% of a game's visits`, `A fair share is ${fmt(r.busiest_even)}%.`);
  if (d.warnings.length) add("note", `${d.warnings.length} numbers could not be read from the report`, d.warnings.join("; "));
  const rank = { crit: 0, warn: 1, note: 2 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev]);
}

// --- sections ----------------------------------------------------------------------------
function masthead(d) {
  const hd = d.header, v = d.verdict || {};
  const facts = [
    ["Test set", hd.reference],
    ["Rules", hd.arm === "base" ? "current game" : hd.arm.replace(/-v\d+$/, "").replace(/-/g, " ")],
    ["Run at", hd.stamp],
    ["Games played", hd.games_total != null ? fmt(hd.games_total, 0) : null],
    ["Time taken", hd.wall_s != null ? fmt(hd.wall_s, 0) + " seconds" : null],
  ];
  return h("header", { class: "mast" },
    h("div", {},
      h("div", { class: "eyebrow" }, "Greener Pastures · simulation report"),
      h("h1", {}, "Computer playtest, ", h("span", {}, hd.reference)),
      h("div", { class: "facts" }, facts.filter((f) => f[1]).map(([k, val]) => h("div", { class: "fact" }, h("span", { class: "eyebrow" }, k), h("b", {}, val)))),
      h("p", { class: "caveat" },
        h("strong", {}, "How to read this. "),
        "Computer players played the games. 2p, 3p and 4p mean games with 2, 3 or 4 players. ",
        "The simulator stops hands at 7 cards; the real game has no hand limit. ",
        `Numbers can only be compared with other runs of the same test set (${hd.reference}).`),
    ),
    h("div", { class: "verdict", "aria-label": "Results of the checks" },
      h("div", { class: "vcount pass" }, h("span", { class: "eyebrow" }, "Passed"), h("b", {}, v.pass ?? "?")),
      h("div", { class: "vcount fail" }, h("span", { class: "eyebrow" }, "Failed"), h("b", {}, v.fail ?? "?")),
      h("div", { class: "vcount", title: "Tracked checks have no pass mark" }, h("span", { class: "eyebrow" }, "Tracked"), h("b", {}, v.observe ?? "?")),
    ),
  );
}

function attention(d) {
  const flags = computeFlags(d);
  const icon = { crit: "✕", warn: "!", note: "i" };
  const sevName = { crit: "Problem", warn: "Worth watching", note: "For information" };
  const list = h("ul", { class: "flags" }, flags.map((f) =>
    h("li", { class: `flag ${f.sev}` }, h("span", { class: "ic", "aria-label": sevName[f.sev], title: sevName[f.sev] }, icon[f.sev]), h("div", {}, h("div", { class: "t" }, f.t), f.d ? h("div", { class: "d" }, f.d) : null))));
  const checks = h("div", { class: "checks" }, d.checks.map((c) => {
    const p = plainCheck(d, c);
    return h("details", { class: `check ${c.status}` },
      h("summary", {},
        h("span", { class: "id", title: "The check's number in the simulator report" }, checkId(c.id)), h("span", { class: "pill " + c.status }, STATUS[c.status]),
        h("span", { class: "ti", style: "grid-column:1/-1" }, p.name),
        p.tracks ? h("span", { class: "tr" }, h("b", {}, "Tracks: "), p.tracks) : null,
        h("span", { class: "rs" }, h("b", {}, "This run: "), p.result)),
      h("div", { class: "body" },
        h("div", { class: "raw" }, `The simulator's own wording (it calls this "${c.title}"):`),
        c.measured ? h("div", {}, h("b", {}, "Measured. "), c.measured) : null,
        c.rule ? h("div", {}, h("b", {}, "Rule. "), c.rule) : null,
        c.details.slice(0, 12).map((x) => h("div", {}, "· " + x))));
  }));
  const retired = d.retired.length ? h("p", { class: "note", style: "margin-top:10px" }, "No longer checked, because the rule they tested has gone: " + d.retired.map((r) => RETIRED_NAMES[+r[0]] || r[1]).join(" · ") + ".") : null;
  return section("attention", "What needs attention", "Problems are picked out automatically, by the same rules every time.",
    h("div", { class: "attn" },
      panel(`${flags.length} things to look at`, "Problems first, then things worth watching, then information.", list),
      panel("What we check", [`${d.checks.length} checks. Passed and Failed checks have a target; Tracked checks are watched without one. `, h("span", { class: "noprint" }, "Click a check to read the simulator's full wording.")], checks, retired)));
}

function targets(d) {
  const r = d.readings, s = d.series;
  const slot = panel("Turns with a visit", "Share of turns on which a player visited a rival (filled dot). Target: 30% to 60%, shaded. The hollow dot counts cards played onto boards, which A Helping Hand can make two in one turn.",
    legend([["band", "", "target"], ["", "background:var(--ink-2)", "turns with a visit"], ["hollow", "", "cards played per turn"]]),
    h("div", { class: "rows" },
      SEATS.map((x) => bullet({ label: seatLabel(x), value: r.slot_turns_seat?.[x], second: r.plays_turn_seat?.[x], secondName: "cards played per turn", lo: 0, hi: 100, band: [30, 60], color: SEAT_VAR[x], unit: "%", tip: `${PLAYERS[x]}, turns with a visit` })),
      bullet({ label: "all games", value: r.slot_turns, second: r.plays_turn, secondName: "cards played per turn", lo: 0, hi: 100, band: [30, 60], unit: "%", tip: "All games, turns with a visit" })),
    axis([0, 25, 50, 75, 100], 0, 100, "%"));
  const hook = panel("Visits per turn", "Visits to a rival per player per turn. Dashed line: the target of at least 0.5.",
    h("div", { class: "rows" },
      SEATS.map((x) => bullet({ label: seatLabel(x), value: r.hook_seat?.[x], lo: 0, hi: 1, floor: 0.5, color: SEAT_VAR[x], dp: 2, tip: `${PLAYERS[x]}, visits per turn` })),
      bullet({ label: "all games", value: r.hook, lo: 0, hi: 1, floor: 0.5, dp: 2, tip: "All games, visits per turn" })),
    axis([0, 0.25, 0.5, 0.75, 1], 0, 1),
    h("p", { class: "note", style: "margin:10px 0 0" }, `${fmt(r.cross_table, 0)}% of visits went to a rival (it should always be 100%).`));
  const act = s["actions per turn (mean)"];
  const actions = panel("Actions per turn", "The main action plus any visit, per player per turn. Dashed line: the target of about 1.5.",
    h("div", { class: "rows" },
      SEATS.map((x) => bullet({ label: seatLabel(x), value: act?.[x]?.v, lo: 1, hi: 2.5, floor: 1.5, color: SEAT_VAR[x], dp: 2, tip: `${PLAYERS[x]}, actions per turn` })),
      bullet({ label: "all games", value: r.actions, lo: 1, hi: 2.5, floor: 1.5, dp: 2, tip: "All games, actions per turn" })),
    axis([1, 1.5, 2, 2.5], 1, 2.5));
  const vp = d.vp_sources;
  const vpPanel = panel("Where the winner's points come from", "The design wants at least half from island tokens (dashed line).",
    vp ? h("div", {},
      h("div", { class: "track", style: "height:30px;margin:6px 0 8px" },
        h("div", { class: "seg", style: `left:0;width:calc(${vp.island}% - 2px);background:var(--accent);border-radius:4px 0 0 4px`, "data-tip": `Island tokens ${vp.island}%` }),
        h("div", { class: "seg", style: `left:${vp.island}%;width:calc(${vp.printed}% - 2px);background:var(--s2p)`, "data-tip": `VP printed on built cards ${vp.printed}%` }),
        h("div", { class: "seg", style: `left:${vp.island + vp.printed}%;width:${vp.endgame}%;background:var(--s3p);border-radius:0 4px 4px 0`, "data-tip": `Game-end scoring ${vp.endgame}%` }),
        h("div", { class: "refline", style: "left:50%;top:-4px;bottom:-4px" })),
      legend([["", "background:var(--accent)", `island tokens ${vp.island}%`], ["", "background:var(--s2p)", `VP printed on built cards ${vp.printed}%`], ["", "background:var(--s3p)", `game-end scoring (Barn and Endgame cards) ${vp.endgame}%`]]))
      : h("p", { class: "muted" }, "Not in this report."));
  const un = s["unfinished"];
  const unf = panel("Unfinished games, and full hands", "Games that ran out of cards or hit the simulator's move limit (dashed line: 1.5%). Below: turns that began with 7 cards, the simulator's cap (dashed line: 10%).",
    h("div", { class: "rows" },
      SEATS.map((x) => bullet({ label: seatLabel(x), value: un?.[x]?.v, lo: 0, hi: 5, floor: 1.5, color: SEAT_VAR[x], unit: "%", tip: `${PLAYERS[x]}, games unfinished` }))),
    axis([0, 1, 2, 3, 4, 5], 0, 5, "%"),
    h("div", { class: "rows", style: "margin-top:14px" },
      SEATS.map((x) => bullet({ label: seatLabel(x), value: r.hand_bound_seat?.[x], lo: 0, hi: 25, floor: 10, color: SEAT_VAR[x], unit: "%", tip: `${PLAYERS[x]}, turns starting with 7 cards` }))),
    axis([0, 5, 10, 15, 20, 25], 0, 25, "%"));
  const hand = r.hand || {};
  const eng = panel("Simulator workload", "The simulator slows down when a player must choose which cards to discard down to 7.",
    h("div", { class: "tiles" },
      h("div", { class: "tile" }, h("b", { style: hand.worst_moves > 250000 ? "color:var(--crit-ink)" : "" }, fmt(hand.worst_moves, 0)), h("span", {}, "most options at a single decision")),
      h("div", { class: "tile" }, h("b", {}, fmt(hand.mean, 1)), h("span", {}, "cards in hand at the start of a turn (average)")),
      h("div", { class: "tile" }, h("b", {}, fmt(hand.peak, 0)), h("span", {}, "most cards ever in hand")),
      h("div", { class: "tile" }, h("b", {}, fmt(d.header.wall_s, 0, "s")), h("span", {}, "time to play every game"))));
  return section("targets", "Targets", "Numbers with a target set by Dean or the design, by player count.",
    h("div", { class: "grid" }, slot, hook, actions, vpPanel, unf, eng));
}

function seriesTable(d) {
  const s = d.series, r = d.readings;
  const rows = [
    ["game length, rounds (median)", "Game length in rounds (typical)", 0],
    ["winning score (median)", "Winning score (typical)", 0],
    ["score spread, top - bottom", "Points between first and last", 0],
    ["last as % of winner (median)", "Last place's score as a share of the winner's", 0, "%"],
    ["games with a tied top score", "Games with a tie for first", 1, "%"],
    ["lead changes (median)", "Times the lead changed hands (typical)", 0],
    ["deliveries per player (mean)", "Deliveries per player (average)", 2],
    ["island filled at game end", "Island spaces filled by the end", 0, "%"],
    ["actions per turn (mean)", "Actions per turn (average)", 2],
    ["bonus slot used / turn", "Turns with a visit", 0, "%"],
    ["visits received / player / game", "Visits each player receives per game", 2],
    ["barn cards paid by a RIVAL", "Barn cards that came from rivals' visits", 0, "%"],
    ["board loaded and uncleared / turn", "Notice Boards at 3+ cards and not harvested", 0, "%"],
    ["barn at game end (median)", "Cards left in a barn at the end (typical)", 0],
    ["reshuffles per played deck", "Times each crop deck in play was reshuffled", 2],
    ["unfinished", "Games that never finished", 1, "%"],
  ];
  const find = (k) => s[k] || s[Object.keys(s).find((x) => k.startsWith(x))];
  const body = rows.map(([k, label, dp, unit]) => {
    const row = find(k);
    if (!row) return null;

  { label: "Store coins left unused per player", get: (r) => r.readings.coins?.dead, dp: 2, res: 0.01 },
  { label: "Turns starting with 7 cards", get: (r) => r.readings.hand?.at_bound, dp: 1, unit: "%", res: 0.1 },
  { label: "Most options at one decision", get: (r) => r.readings.hand?.worst_moves, dp: 0, res: 1 },

function armName(run) {
  const a = run.header.arm;
  return a === "base" ? "current game" : a.replace(/-v\d+$/, "").replace(/-/g, " ");
}
function variants(d) {
  const A = DATA.arms;
  if (!A) return null;
  const runs = A.runs, control = runs[0], mv = A.noise?.movement || {};
  const head = h("tr", {}, h("th", {}, "Measure"), runs.map((r, i) => h("th", { style: "white-space:normal;min-width:110px" }, i === 0 ? "compared with: " : "", armName(r), h("div", { class: "muted", style: "text-transform:none;letter-spacing:0;font-weight:400" }, r.header.stamp))));
  const verdictRow = h("tr", {}, h("td", {}, "Checks passed / failed / tracked"), runs.map((r) => h("td", {}, r.verdict ? `${r.verdict.pass} / ${r.verdict.fail} / ${r.verdict.observe}` : "n/a")));
  const body = [verdictRow];
  for (const m of ARM_METRICS) {
    if (m.group) { body.push(h("tr", {}, h("td", { colspan: runs.length + 1, class: "txt", style: "padding-top:14px;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase" }, m.group))); continue; }
    const base = m.get(control);
    const floor = m.noise && mv[m.noise.key] != null ? mv[m.noise.key] * m.noise.scale : null;
    const thr = floor == null ? null : Math.max(floor, m.res);
    const cells = runs.map((r, i) => {
      const v = m.get(r);
      if (i === 0 || !isNum(v) || !isNum(base)) return h("td", {}, fmt(v, m.dp, m.unit || ""));
      const dlt = v - base;
      let cls = "", mark = "", tip;
      if (thr != null) {
        const real = Math.abs(dlt) > thr + 1e-9;
        cls = real ? "beyond" : "within";
        mark = real ? " ▲" : "";
        tip = `Changed by ${fmt(dlt, m.dp)}. Two identical runs differ by up to ${fmt(thr, Math.max(m.dp, 1))}, so this is ${real ? "a real change" : "probably chance"}.`;
      } else if (m.ci) {
        const a = m.ci(r), b = m.ci(control);
        const apart = a && b && (a[0] > b[1] || a[1] < b[0]);
        cls = apart ? "beyond" : "within";
        mark = apart ? " ▲" : "";
        tip = `Changed by ${fmt(dlt, m.dp)}. ${apart ? "The likely ranges do not overlap, so this is a real change." : "The likely ranges overlap, so this could be chance."}`;
      } else tip = `Changed by ${fmt(dlt, m.dp)}. We do not know how much this measure varies by chance.`;
      const sign = dlt > 0 ? "+" : "";
      return h("td", { "data-tip": tip }, fmt(v, m.dp, m.unit || ""), " ", h("span", { class: cls || "muted" }, `(${sign}${fmt(dlt, m.dp)})${mark}`));
    });
    const label = m.suit ? h("span", { style: "display:inline-flex;gap:6px;align-items:center" }, h("span", { class: "chip", style: `background:${SUIT_HEX[m.suit]}` }), m.label) : m.label.trim();
    body.push(h("tr", {}, h("td", { style: m.label.startsWith("  ") ? "padding-left:22px" : "" }, label, thr == null && !m.ci ? h("span", { class: "tag", title: "We do not know how much this varies by chance" }, "unknown chance") : null), cells));
  }
  const mixed = A.mixed_references ? h("p", { class: "note", style: "color:var(--crit-ink)" }, `These variants were run on different test sets (${A.mixed_references.join(", ")}), so the comparison is not fair.`) : null;
  const sameRef = A.reference === d.header.reference;
  return section("variants", "Rule variants compared", `Each variant against the first column, on the same shuffled games (test set ${A.reference}).${sameRef ? "" : ` These are not the games above, so compare these numbers only with each other.`}`,
    h("div", { class: "panel" },
      h("p", { class: "note" }, "Brackets show the change from the first column. A red ▲ marks a change bigger than two identical runs would show by chance.", h("span", { class: "noprint" }, " Hover a number for the detail.")),
      mixed,
      h("div", { class: "tw" }, h("table", { class: "t" }, h("thead", {}, head), h("tbody", {}, body)))));
}

function glossary() {
  const items = [
    ["Typical", "the middle value: half the games were above it and half below."],
    ["Average", "the total divided by the number of games or turns."],
    ["Fair share", "how often each player would win, or each board would be visited, if nothing gave anyone an edge."],
    ["Likely range", "where the true figure almost certainly sits, given how many games were played."],
    ["Chance", "the difference between two runs of identical rules with differently shuffled cards."],
    ["Visit", "playing a card from your hand onto a rival's Notice Board to take its power."],
    ["Test set", "the fixed collection of shuffled games the simulator plays. Numbers are only comparable within one test set."],
  ];
  return section("words", "Words used on this page", null,
    h("div", { class: "panel" }, h("div", { class: "gloss" }, items.map(([k, v]) => h("div", {}, h("b", {}, k), ": ", v)))));
}

function footer(d) {
  const n = DATA.noise;
  return h("footer", { class: "foot" },
    h("div", {}, `Report: ${d.header.file}`),
    h("div", {}, `Chance variation measured in: ${n ? `${n.file} (${n.measured})` : "none found"}`),
    DATA.arms ? h("div", {}, `Variants: ${DATA.arms.runs.map((r) => r.header.file).join(", ")}`) : null,
    h("div", {}, `Card data ${d.header.data ? d.header.data.slice(0, 12) : "n/a"} · engine ${d.header.engine || "n/a"}`),
    h("div", {}, `Built ${DATA.built} by tools/sim-dashboard.py.${d.warnings.length ? " Could not read: " + d.warnings.join("; ") : " Every number was read."}`));
}

function render() {
  const app = document.getElementById("app");
  if (!DATA) { app.append(h("p", {}, "No data. Build this page with tools/sim-dashboard.py.")); return; }
  const d = DATA.baseline;
  app.append(
    masthead(d), attention(d), targets(d), seriesTable(d), crops(d), islandAndBarns(d), seatsAndStyles(d),
    section("cards", "Choices and cards", null, h("div", { class: "grid wide" }, choices(d), leastPlayed(d))),
    ...[variants(d), glossary(), footer(d)].filter(Boolean));
}
render();

// --- tooltip ---------------------------------------------------------------------------
const tip = document.getElementById("tip");
document.addEventListener("pointermove", (e) => {
  const t = e.target.closest?.("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.getAttribute("data-tip");
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = e.clientY + 16 + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.opacity = 1;
});
</script>
