name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN permissions are not enough.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      # v4 stopped bundling dotfiles into the artifact. `packages/ui/dist` has
      # none (no `.nojekyll` needed: the artifact path skips Jekyll entirely),
      # so the `include-hidden-files` input stays off.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
