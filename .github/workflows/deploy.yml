name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN permissions are not enough.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # B2, 25/09/2026: the regression this pass fixed (B1, the 1024x700
      # floor) shipped because nothing in CI ever rendered the built app - the
      # step below is what makes that impossible again. Reuses
      # `card-sheets.yml`'s own Chromium install so the two workflows do not
      # carry two different pins of the same browser.
      - name: Install Chromium (for verify:layout)
        run: npx playwright-core install --with-deps chromium

      - name: Verify layout (table)
        run: npm run verify:layout

      - name: Verify layout (result screen)
        run: npm run verify:layout -- --result

      - uses: actions/configure-pages@v6

      # v4 stopped bundling dotfiles into the artifact. `packages/ui/dist` has
      # none (no `.nojekyll` needed: the artifact path skips Jekyll entirely),
      # so the `include-hidden-files` input stays off.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
